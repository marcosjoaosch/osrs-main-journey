name: Atualizar quests do WikiSync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-quests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Consultar o WikiSync
        run: curl --fail --silent --show-error --location "https://sync.runescape.wiki/runelite/player/samurai_jao/STANDARD" --output /tmp/quest-data.json

      - name: Atualizar apenas quando as quests mudarem
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fresh = json.loads(Path('/tmp/quest-data.json').read_text(encoding='utf-8'))
          target = Path('quest-data.json')
          current = json.loads(target.read_text(encoding='utf-8')) if target.exists() else {}

          if fresh.get('quests') != current.get('quests'):
              target.write_text(json.dumps(fresh, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar o novo diário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quest-data.json
          git diff --cached --quiet || git commit -m "Atualiza quests do WikiSync"
          git push
