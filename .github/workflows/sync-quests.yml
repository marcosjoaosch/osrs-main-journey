name: Atualizar quests do WikiSync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-quests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Consultar o WikiSync
        run: |
          curl --fail --silent --show-error --location "https://sync.runescape.wiki/runelite/player/samurai_jao/STANDARD" --output /tmp/quest-data.json
          curl --fail --silent --show-error --location "https://sync.runescape.wiki/runelite/player/Iron%20Samuka/STANDARD" --output /tmp/quest-data-iron-samuka.json

      - name: Atualizar quando qualquer progresso do WikiSync mudar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pairs = [
              (Path('/tmp/quest-data.json'), Path('quest-data.json')),
              (Path('/tmp/quest-data-iron-samuka.json'), Path('quest-data-iron-samuka.json')),
          ]
          for source, target in pairs:
              fresh = json.loads(source.read_text(encoding='utf-8'))
              current = json.loads(target.read_text(encoding='utf-8')) if target.exists() else {}
              tracked = (
                  'quests', 'achievement_diaries', 'combat_achievements',
                  'collection_log', 'collectionLogItemCount', 'levels'
              )
              if any(fresh.get(key) != current.get(key) for key in tracked):
                  target.write_text(json.dumps(fresh, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar o novo diário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quest-data.json quest-data-iron-samuka.json
          git diff --cached --quiet || git commit -m "Atualiza quests do WikiSync"
          git push
